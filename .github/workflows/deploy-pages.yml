name: Deploy NPC HOOD to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Install contract compiler dependencies
        working-directory: contracts
        run: npm ci

      - name: Compile contract and sync wallet deploy artifact
        working-directory: contracts
        env:
          HARDHAT_DISABLE_TELEMETRY_PROMPT: "true"
        run: npm run compile && npm run export:frontend

      - name: Build static frontend
        env:
          VITE_NPC_HOOD_CHAIN_ID: ${{ vars.VITE_NPC_HOOD_CHAIN_ID }}
          VITE_NPC_HOOD_CHAIN_NAME: ${{ vars.VITE_NPC_HOOD_CHAIN_NAME }}
          VITE_NPC_HOOD_CONTRACT_ADDRESS: ${{ vars.VITE_NPC_HOOD_CONTRACT_ADDRESS }}
          VITE_NPC_HOOD_CURRENCY_SYMBOL: ${{ vars.VITE_NPC_HOOD_CURRENCY_SYMBOL }}
          VITE_NPC_HOOD_EXPLORER_URL: ${{ vars.VITE_NPC_HOOD_EXPLORER_URL }}
        run: pnpm build:static

      - name: Preserve custom domain
        run: cp CNAME dist/public/CNAME

      - name: Verify Pages artifact
        run: test -s dist/public/index.html && test -s dist/public/deploy.html && test "$(cat dist/public/CNAME)" = "npcshood.xyz"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
