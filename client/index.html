  <body>
    <div id="root"></div>
    <script src="/api/platform/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Freshness guard: phone browsers love caching this page, which used to
      // hide new deploys behind an old bundle. Compare the bundle this page
      // loaded with the one a no-store fetch of the page itself references,
      // and reload once (guarded per session) when a newer deploy exists.
      (function () {
        try {
          var tag = document.querySelector('script[src*="/assets/main-"]');
          var current = tag ? tag.getAttribute("src") : null;
          if (current && current.charAt(0) === ".") current = current.slice(1);
          if (!current) return;
          if (sessionStorage.getItem("npchood:bundle") === current) return;
          fetch(location.pathname + "?fresh=" + Date.now(), { cache: "no-store" })
            .then(function (r) {
              return r.ok ? r.text() : "";
            })
            .then(function (html) {
              var match = html.match(/\/assets\/main-[^"]+\.js/);
              var latest = match ? match[0] : null;
              sessionStorage.setItem("npchood:bundle", latest || current);
              if (latest && latest !== current) {
                location.replace(location.pathname + "?v=" + encodeURIComponent(latest) + location.hash);
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
  </body>
